name: QA Brain Bridge (TestDriver AI + Gemini to Jules)

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["TestDriver"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  analyze-and-brief:
    # Trigger if it's a PR comment from testdriverai OR if triggered by workflow_run
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       (contains(github.event.comment.user.login, 'testdriver') || contains(github.event.comment.body, 'testdriver'))) ||
      github.event_name == 'workflow_run'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract Payload and Run Gemini Analysis
        id: gemini_analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TESTDRIVER_PAYLOAD: ${{ github.event.comment.body || 'Workflow Run Completed' }}
        run: |
          mkdir -p /tmp/output
          python .github/scripts/analyze_testdriver.py > /tmp/output/brief.md
          cat /tmp/output/brief.md

      - name: Comment Brief on Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const brief = fs.readFileSync('/tmp/output/brief.md', 'utf8');

            const issue_number = context.payload.issue ? context.payload.issue.number : context.payload.workflow_run.pull_requests[0]?.number;

            if (!issue_number) {
              console.log('No PR issue number found to comment on.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: brief
            });
