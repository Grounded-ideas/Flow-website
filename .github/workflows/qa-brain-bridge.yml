name: QA Brain Bridge (TestDriver AI + Gemini to Jules)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-and-brief:
    # Require comment author to be an official TestDriver account
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (github.event.comment.user.login == 'testdriverai[bot]' ||
       github.event.comment.user.login == 'testdriverai' ||
       github.event.comment.user.login == 'testdriver-ai[bot]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Extract Payload and Run Gemini Analysis
        id: gemini_analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TESTDRIVER_PAYLOAD: ${{ github.event.comment.body }}
        run: |
          mkdir -p /tmp/output
          python .github/scripts/analyze_testdriver.py > /tmp/output/brief.md
          cat /tmp/output/brief.md

      - name: Comment Brief on Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const brief = fs.readFileSync('/tmp/output/brief.md', 'utf8');

            const issue_number = context.payload.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: brief
            });
